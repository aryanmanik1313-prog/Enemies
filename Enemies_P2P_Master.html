                isBouncy: (type === "ION" || type === "ZENITH"),
                isExplosive: (type === "NOVA" || type === "VOID"),
                gravity: (type === "MK" || type === "NOVA") ? 9.8 : 1.5,
                damage: 20 + Math.floor(i/2)
            };
        });

        const PROJ_GEOS = {
            "MK": new THREE.BoxGeometry(0.4, 0.4, 1.8),
            "ION": new THREE.SphereGeometry(0.6, 8, 8),
            "NOVA": new THREE.TetrahedronGeometry(0.8),
            "PLASMA": new THREE.CylinderGeometry(0.2, 0.2, 2.5, 8),
            "ZENITH": new THREE.TorusGeometry(0.5, 0.15, 6, 12),
            "VOID": new THREE.OctahedronGeometry(0.7)
        };

        let peer, connections = [], isHost = false, gameStarted = false, gameOver = false;
        let scene, camera, renderer, clock;
        let player = { pos: new THREE.Vector3(0,0,0), rotY: 0, rotX: 0, hp: 100, shield: 0, weaponIdx: 0, ammo: 10, vY: 0 };
        let remotePlayers = {}; 
        let chests = {}, bullets = [], walls = [], slabs = [];
        let moveJS = { active: false, x: 0, y: 0, id: -1, startX:0, startY:0 };
        let lookTouch = { active: false, id: -1, lastX: 0, lastY: 0 };
        let firing = false, lastFire = 0, isReloading = false;
        let gunModel = null, gunRecoil = 0;

        function log(msg) {
            console.log(msg);
            const debugEl = document.getElementById('debug-log');
            if (debugEl) debugEl.innerText = msg;
        }

        function generateId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let res = '';
            for(let i=0; i<6; i++) res += chars.charAt(Math.floor(Math.random()*chars.length));
            return res;
        }

        function initPeer(customId = null) {
            log("Init Peer Network...");
            peer = new Peer(customId);
            peer.on('open', code => {
                const el = document.getElementById('display-id');
                if(el) el.innerText = code;
                log("Peer Ready: " + code);
            });
            peer.on('connection', conn => {
                log("New connection established!");
                connections.push(conn);
                setupConn(conn);
                updateLobbyStatus();
            });
            peer.on('error', err => {
                log("Error: " + err.type);
                if(err.type === 'unavailable-id') initPeer(generateId());
            });
        }

        function updateLobbyStatus() {
            const status = document.getElementById('player-status');
            if(status) status.innerText = `${connections.length + 1} Player(s) connected`;
        }

        function setupConn(conn) {
            conn.on('data', d => {
                if(d.type === 'start') {
                    createArena(d.walls); 
                    d.chests.forEach(c => spawnChest(c.id, c.x, c.z));
                    startGame();
                }
                if(d.type === 'collect') removeChest(d.id);
                if(d.type === 'spawn_chest') spawnChest(d.id, d.x, d.z);
                if(d.type === 'bullet') spawnRemoteBullet(d.pos, d.dir, d.color, d.wpInfo);
                if(d.type === 'move') syncRemoteData(conn.peer, d.pos, d.rotY, d.hp);
                if(d.type === 'hit') takeDamage(d.amount);
                if(d.type === 'game_over_broadcast') {
                   if(d.deadId === peer.id) {
                       triggerGameOver("YOU WERE DEFEATED");
                   } else {
                       triggerGameOver("YOU ARE VICTORIOUS!");
                   }
                }
            });
            conn.on('close', () => {
                if(remotePlayers[conn.peer]) {
                    scene.remove(remotePlayers[conn.peer].mesh);
                    remotePlayers[conn.peer].arrow.remove();
                    remotePlayers[conn.peer].hpContainer.remove();
                    delete remotePlayers[conn.peer];
                }
                updateLobbyStatus();
            });
        }

        function triggerGameOver(msg) {
            if(gameOver) return;
            gameOver = true;
            document.getElementById('game-over').style.display = 'flex';
            document.getElementById('over-msg').innerText = msg;
            
            if(msg.includes("VICTORIOUS")) {
                document.getElementById('over-title').innerText = "CHAMPION";
                document.getElementById('over-title').style.color = "#22c55e";
            } else {
                document.getElementById('over-title').innerText = "Wasted";
                document.getElementById('over-title').style.color = "#ef4444";
            }

            connections.forEach(c => { 
                if(c.open) c.send({ 
                    type: 'game_over_broadcast', 
                    deadId: player.hp <= 0 ? peer.id : "other" 
                }); 
            });
        }

        function takeDamage(amt) {
            if(gameOver) return;
            if(player.shield > 0) {
                player.shield -= amt;
                if(player.shield < 0) { player.hp += player.shield; player.shield = 0; }
            } else {
                player.hp -= amt;
            }
            if(player.hp <= 0) {
                player.hp = 0;
                triggerGameOver("YOU WERE DEFEATED");
                connections.forEach(c => {
                   if(c.open) c.send({ type: 'game_over_broadcast', deadId: peer.id });
                });
            }
        }

        document.getElementById('host-btn').onclick = () => {
            isHost = true;
            initPeer(generateId());
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('wait-view').classList.remove('hidden');
        };

        document.getElementById('join-btn').onclick = () => {
            const code = document.getElementById('join-input').value.trim().toUpperCase();
            if(!code) return;
            initPeer();
            peer.on('open', () => {
                log("Connecting...");
                const conn = peer.connect(code);
                connections.push(conn);
                setupConn(conn);
                document.getElementById('join-btn').innerText = "JOINED";
                document.getElementById('join-btn').style.background = "#22c55e";
            });
        };

        document.getElementById('start-btn').onclick = () => {
            if(!isHost) return;
            const mazeData = generateMazeData();
            const chestList = Array.from({length: 15}, (_, i) => ({ id: 'c'+i, x: (Math.random()-0.5)*400, z: (Math.random()-0.5)*400 }));
            createArena(mazeData);
            chestList.forEach(c => spawnChest(c.id, c.x, c.z));
            startGame();
            connections.forEach(c => { if(c.open) c.send({ type: 'start', walls: mazeData, chests: chestList }); });
        };

        function syncRemoteData(id, pos, rotY, hp) {
            if(!scene) return;
            if(!remotePlayers[id]) {
                const geo = new THREE.BoxGeometry(6, 12, 6);
                const mat = new THREE.MeshBasicMaterial({ color: 0xff0000 }); 
                const mesh = new THREE.Mesh(geo, mat);
                scene.add(mesh);
                
                const arrow = document.createElement('div');
                arrow.className = 'dot enemy-arrow';
                document.getElementById('minimap-content').appendChild(arrow);
                
                const hpContainer = document.createElement('div');
                hpContainer.className = 'remote-hp-bar';
                hpContainer.innerHTML = `<div class="remote-hp-fill"></div>`;
                document.body.appendChild(hpContainer);

                remotePlayers[id] = { mesh, arrow, hpContainer, id, currentHp: 100 };
            }
            
            const rp = remotePlayers[id];
            rp.mesh.position.set(pos.x, pos.y + 6, pos.z);
            rp.mesh.rotation.y = rotY;
            rp.currentHp = hp || 0;
            
            if(rp.currentHp <= 0 && !gameOver) {
                triggerGameOver("YOU ARE VICTORIOUS!");
            }

            rp.arrow.style.left = (75 + (pos.x / 500) * 150) + 'px';
            rp.arrow.style.top = (75 + (pos.z / 500) * 150) + 'px';
            rp.arrow.style.transform = `translate(-50%, -50%) rotate(${-rotY}rad)`;
        }

        function spawnChest(id, x, z) {
            if(chests[id]) return;
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(6, 6, 6), new THREE.MeshPhongMaterial({ color: 0xffdd00, emissive: 0x664400 }));
            mesh.position.set(x, 3, z);
            if(scene) scene.add(mesh);
            const dot = document.createElement('div');
            dot.className = "dot chest-dot";
            dot.style.left = (75 + (x / 500) * 150) + 'px';
            dot.style.top = (75 + (z / 500) * 150) + 'px';
            const mini = document.getElementById('minimap-content');
            if (mini) mini.appendChild(dot);
            chests[id] = { mesh, dot, x, z };
        }

        function removeChest(id) {
            if(!chests[id]) return;
            if(scene) scene.remove(chests[id].mesh);
            if(chests[id].dot) chests[id].dot.remove();
            const {x, z} = chests[id];
            delete chests[id];
            if(isHost) {
                setTimeout(() => {
                    spawnChest(id, x, z);
                    connections.forEach(c => { if(c.open) c.send({ type: 'spawn_chest', id, x, z }); });
                }, 10000);
            }
        }

        function generateMazeData() {
            const data = [];
            data.push({x:0, z:250, w:500, d:10, isBoundary: true}); 
            data.push({x:0, z:-250, w:500, d:10, isBoundary: true});
            data.push({x:250, z:0, w:10, d:500, isBoundary: true}); 
            data.push({x:-250, z:0, w:10, d:500, isBoundary: true});
            
            for(let i=0; i<15; i++) {
                const wx = Math.round((Math.random()-0.5)*8)*50;
                const wz = Math.round((Math.random()-0.5)*8)*50;
                const isHoriz = Math.random() > 0.5;
                data.push({ x: wx, z: wz, w: isHoriz ? 80 : 20, d: isHoriz ? 20 : 80, isBoundary: false });
            }
            return data;
        }

        function createArena(data) {
            scene = scene || new THREE.Scene();
            const mat = new THREE.MeshPhongMaterial({ color: 0x1e293b, emissive: 0x0f172a });
            data.forEach(w => {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w.w, 20, w.d), mat);
                mesh.position.set(w.x, 10, w.z);
                scene.add(mesh);
                walls.push({ x1: w.x-w.w/2, x2: w.x+w.w/2, z1: w.z-w.d/2, z2: w.z+w.d/2, mesh });
                const dot = document.createElement('div');
                dot.className = "wall-dot";
                dot.style.width = (w.w/500 * 150) + 'px';
                dot.style.height = (w.d/500 * 150) + 'px';
                dot.style.left = (75 + (w.x/500)*150 - (w.w/1000)*150) + 'px';
                dot.style.top = (75 + (w.z/500)*150 - (w.d/1000)*150) + 'px';
                const mini = document.getElementById('minimap-content');
                if (mini) mini.appendChild(dot);
                addSelectiveSlabs(w);
            });
        }

        function addSelectiveSlabs(wall) {
            const slabMat = new THREE.MeshPhongMaterial({ color: 0x64748b });
            const slabOffsets = [
                { dx: wall.w/2 + 6, dz: 0, w: 10, d: wall.d }, 
                { dx: -(wall.w/2 + 6), dz: 0, w: 10, d: wall.d },
                { dx: 0, dz: wall.d/2 + 6, w: wall.w, d: 10 }, 
                { dx: 0, dz: -(wall.d/2 + 6), w: wall.w, d: 10 }
            ];

            slabOffsets.forEach(off => {
                const targetX = wall.x + off.dx;
                const targetZ = wall.z + off.dz;
                let shouldPlace = false;
                if (wall.isBoundary) {
                    if(Math.abs(targetX) < 255 && Math.abs(targetZ) < 255) shouldPlace = true;
                } else {
                    if (Math.random() < 0.4) shouldPlace = true;
                }

                if (shouldPlace) {
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(off.w, 6, off.d), slabMat);
                    mesh.position.set(targetX, 3, targetZ);
                    scene.add(mesh);
                    slabs.push({ x1: targetX - off.w/2, x2: targetX + off.w/2, z1: targetZ - off.d/2, z2: targetZ + off.d/2, h: 6 });
                    
                    const sDot = document.createElement('div');
                    sDot.className = "slab-dot";
                    sDot.style.width = (off.w/500 * 150) + 'px';
                    sDot.style.height = (off.d/500 * 150) + 'px';
                    sDot.style.left = (75 + (mesh.position.x/500)*150 - (off.w/1000)*150) + 'px';
                    sDot.style.top = (75 + (mesh.position.z/500)*150 - (off.d/1000)*150) + 'px';
                    const mini = document.getElementById('minimap-content');
                    if(mini) mini.appendChild(sDot);
                }
            });
        }

        function findSafeSpawn() {
            let safe = false; let attempt = 0;
            while(!safe && attempt < 50) {
                const tx = (Math.random() - 0.5) * 400;
                const tz = (Math.random() - 0.5) * 400;
                if(!checkWall(tx, tz, 0)) { player.pos.set(tx, 0, tz); safe = true; }
                attempt++;
            }
            if(!safe) player.pos.set(0,0,0);
        }

        function createGunModel() {
            if(gunModel) scene.remove(gunModel);
            gunModel = new THREE.Group();
            const wp = WEAPONS[player.weaponIdx];
            const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 3), new THREE.MeshPhongMaterial({ color: 0x333333 }));
            barrel.position.z = -1.5; gunModel.add(barrel);
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1, 1.5), new THREE.MeshPhongMaterial({ color: wp.color }));
            gunModel.add(body);
            scene.add(gunModel);
        }

        function startGame() {
            if(gameStarted) return;
            gameStarted = true;
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            scene = scene || new THREE.Scene();
            scene.background = new THREE.Color(0xf8fafc);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 2000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 1.0));
            const sun = new THREE.DirectionalLight(0xffffff, 0.5);
            sun.position.set(100, 200, 100); scene.add(sun);
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshPhongMaterial({ color: 0xffffff }));
            floor.rotation.x = -Math.PI/2; scene.add(floor);
            scene.add(new THREE.GridHelper(1000, 50, 0x000000, 0xcccccc));
            findSafeSpawn();
            createGunModel();
            const pDot = document.createElement('div');
            pDot.id = "p-dot"; pDot.className = "dot player-dot";
            document.getElementById('minimap-content').appendChild(pDot);
            clock = new THREE.Clock();
            setupControls();
            loop();
        }

        function setupControls() {
            window.addEventListener('touchstart', e => {
                for(let t of e.changedTouches) {
                    if(t.target.tagName === 'BUTTON') continue;
                    if(t.clientX < window.innerWidth / 2) {
                        moveJS.active = true; moveJS.id = t.identifier; moveJS.startX = t.clientX; moveJS.startY = t.clientY;
                    } else {
                        lookTouch.active = true; lookTouch.id = t.identifier;
                        lookTouch.lastX = t.clientX; lookTouch.lastY = t.clientY;
                    }
                }
            }, {passive: false});

            window.addEventListener('touchmove', e => {
                for(let t of e.changedTouches) {
                    if(t.identifier === moveJS.id) {
                        const dx = t.clientX - moveJS.startX, dy = t.clientY - moveJS.startY;
                        const dist = Math.min(50, Math.sqrt(dx*dx+dy*dy)), a = Math.atan2(dy, dx);
                        moveJS.x = (Math.cos(a)*dist)/50; moveJS.y = (Math.sin(a)*dist)/50;
                        document.getElementById('js-knob').style.left = (50 + moveJS.x*50)+'%';
                        document.getElementById('js-knob').style.top = (50 + moveJS.y*50)+'%';
                    } else if(t.identifier === lookTouch.id) {
                        player.rotY -= (t.clientX - lookTouch.lastX) * 0.006;
                        player.rotX = Math.max(-1.2, Math.min(1.2, player.rotX - (t.clientY - lookTouch.lastY) * 0.006));
                        lookTouch.lastX = t.clientX; lookTouch.lastY = t.clientY;
                    }
                }
            }, {passive: false});

            window.addEventListener('touchend', e => {
                for(let t of e.changedTouches) {
                    if(t.identifier === moveJS.id) { 
                        moveJS.active = false; moveJS.id = -1;
                        document.getElementById('js-knob').style.left='50%'; document.getElementById('js-knob').style.top='50%';
                    }
                    if(t.identifier === lookTouch.id) { lookTouch.active = false; lookTouch.id = -1; }
                }
            });

            document.getElementById('fire-btn').ontouchstart = e => { e.preventDefault(); firing = true; };
            document.getElementById('fire-btn').ontouchend = e => { firing = false; };
            document.getElementById('reload-btn').ontouchstart = (e) => { e.preventDefault(); reload(); };
            document.getElementById('jump-btn').ontouchstart = (e) => { 
                e.preventDefault(); 
                const standingHeight = onSlab(player.pos.x, player.pos.z);
                if((player.pos.y <= standingHeight + 0.1) && Math.abs(player.vY) < 1.0) {
                    player.vY = 42; 
                }
            };
        }

        function reload() {
            if(isReloading) return;
            isReloading = true;
            document.getElementById('reload-status').innerText = "RELOADING...";
            setTimeout(() => {
                player.ammo = WEAPONS[player.weaponIdx].capacity;
                isReloading = false;
                document.getElementById('reload-status').innerText = "READY";
            }, 1200);
        }

        function spawnBullet(pos, dir, weapon) {
            const geo = PROJ_GEOS[weapon.type] || PROJ_GEOS["MK"];
            const mat = new THREE.MeshPhongMaterial({ color: weapon.color, emissive: weapon.color, emissiveIntensity: 1.0 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(camera.position).add(dir.clone().multiplyScalar(4));
            mesh.lookAt(mesh.position.clone().add(dir));
            scene.add(mesh);
            bullets.push({ mesh, vel: dir.clone().multiplyScalar(weapon.speed), life: 4.0, wp: weapon, isLocal: true });
            player.ammo--; lastFire = Date.now(); gunRecoil = 1.0;
            connections.forEach(c => {
                if(c.open) c.send({
                    type: 'bullet', pos: {x:pos.x, y:pos.y, z:pos.z}, dir: {x:dir.x, y:dir.y, z:dir.z}, 
                    color: weapon.color.getHex(), 
                    wpInfo: { type: weapon.type, isBouncy: weapon.isBouncy, isExplosive: weapon.isExplosive, gravity: weapon.gravity, damage: weapon.damage }
                });
            });
        }

        function spawnRemoteBullet(pos, dir, color, wpInfo) {
            if(!scene) return;
            const geo = PROJ_GEOS[wpInfo.type] || PROJ_GEOS["MK"];
            const mat = new THREE.MeshBasicMaterial({ color });
            const mesh = new THREE.Mesh(geo, mat);
            const p = new THREE.Vector3(pos.x, pos.y, pos.z);
            const d = new THREE.Vector3(dir.x, dir.y, dir.z);
            mesh.position.copy(p);
            mesh.lookAt(p.clone().add(d));
            scene.add(mesh);
            bullets.push({ mesh, vel: d.clone().multiplyScalar(wpInfo.speed || 500), life: 4.0, wp: wpInfo, isLocal: false });
        }

        function onSlab(x, z) {
            for(let s of slabs) {
                if(x > s.x1 && x < s.x2 && z > s.z1 && z < s.z2) return s.h;
            }
            return 0;
        }

        function loop() {
            if(!gameStarted || gameOver) return;
            requestAnimationFrame(loop);
            const dt = Math.min(clock.getDelta(), 0.1);
            
            if(moveJS.active) {
                const moveVec = new THREE.Vector3(moveJS.x, 0, moveJS.y).applyAxisAngle(new THREE.Vector3(0,1,0), player.rotY).multiplyScalar(130 * dt);
                if(!checkWall(player.pos.x + moveVec.x, player.pos.z, player.pos.y)) { player.pos.x += moveVec.x; }
                if(!checkWall(player.pos.x, player.pos.z + moveVec.z, player.pos.y)) { player.pos.z += moveVec.z; }
            }

            player.vY -= 70 * dt;
            player.pos.y += player.vY * dt;

            let floorHeight = onSlab(player.pos.x, player.pos.z);
            if(player.pos.y < floorHeight) { player.pos.y = floorHeight; player.vY = 0; }

            camera.position.set(player.pos.x, player.pos.y + 8, player.pos.z);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.rotY;
            camera.rotation.x = player.rotX;
            
            connections.forEach(c => {
                if(c.open) c.send({ type: 'move', pos: {x: player.pos.x, y: player.pos.y, z: player.pos.z}, rotY: player.rotY, hp: player.hp });
            });
            
            if(gunModel) {
                const forward = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
                const right = new THREE.Vector3(1, 0, 0).applyEuler(camera.rotation);
                const up = new THREE.Vector3(0, 1, 0).applyEuler(camera.rotation);
                gunRecoil *= 0.85;
                const offset = forward.clone().multiplyScalar(2).add(right.clone().multiplyScalar(0.8)).add(up.clone().multiplyScalar(-0.6 + (gunRecoil*0.2)));
                gunModel.position.copy(camera.position).add(offset);
                gunModel.rotation.copy(camera.rotation);
            }

            const wp = WEAPONS[player.weaponIdx];
            if(firing && !isReloading && Date.now() - lastFire > wp.rate) {
                if(player.ammo > 0) {
                    const dir = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation);
                    spawnBullet(camera.position.clone().add(dir.clone().multiplyScalar(2)), dir, wp);
                } else { reload(); }
            }
            
            for(let i=bullets.length-1; i>=0; i--) {
                const b = bullets[i];
                b.vel.add(new THREE.Vector3(0, -b.wp.gravity * 70 * dt, 0));
                const nextPos = b.mesh.position.clone().add(b.vel.clone().multiplyScalar(dt));
                
                let hitWall = false;
                let wallNormal = new THREE.Vector3(0,0,0);
                for(let w of walls) { 
                    if(nextPos.x > w.x1 && nextPos.x < w.x2 && nextPos.z > w.z1 && nextPos.z < w.z2 && nextPos.y < 20) { 
                        hitWall = true; 
                        const dx1 = Math.abs(nextPos.x - w.x1), dx2 = Math.abs(nextPos.x - w.x2);
                        const dz1 = Math.abs(nextPos.z - w.z1), dz2 = Math.abs(nextPos.z - w.z2);
                        const min = Math.min(dx1, dx2, dz1, dz2);
                        if(min === dx1) wallNormal.set(-1, 0, 0);
                        else if(min === dx2) wallNormal.set(1, 0, 0);
                        else if(min === dz1) wallNormal.set(0, 0, -1);
                        else wallNormal.set(0, 0, 1);
                        break; 
                    } 
                }
                if(nextPos.y <= 0) { hitWall = true; wallNormal.set(0, 1, 0); }

                if(!b.isLocal) { 
                   if(nextPos.distanceTo(camera.position) < 8) { takeDamage(b.wp.damage || 15); b.life = 0; }
                } else { 
                    for(let rId in remotePlayers) {
                        const rp = remotePlayers[rId];
                        if(nextPos.distanceTo(rp.mesh.position) < 8) { 
                            const conn = connections.find(c => c.peer === rId);
                            if(conn) conn.send({ type: 'hit', amount: b.wp.damage || 15 });
                            b.life = 0; break;
                        }
                    }
                }

                if(!hitWall) { b.mesh.position.copy(nextPos); b.mesh.lookAt(nextPos.clone().add(b.vel)); }
                else {
                    if(b.wp.isBouncy) { b.vel.reflect(wallNormal).multiplyScalar(0.7); b.mesh.position.add(b.vel.clone().multiplyScalar(dt)); }
                    else if(b.wp.isExplosive) { b.mesh.scale.set(6, 6, 6); b.life = 0.1; b.wp.isExplosive = false; }
                    else { b.life = 0; }
                }

                b.life -= dt;
                if(b.life <= 0) { scene.remove(b.mesh); bullets.splice(i, 1); }
            }
            
            Object.keys(chests).forEach(id => {
                if(player.pos.distanceTo(chests[id].mesh.position) < 12) {
                    player.weaponIdx = Math.floor(Math.random()*WEAPONS.length);
                    player.ammo = WEAPONS[player.weaponIdx].capacity;
                    player.shield = 100;
                    removeChest(id); createGunModel();
                    connections.forEach(conn => { if(conn.open) conn.send({ type: 'collect', id }); });
                    const alert = document.getElementById('pickup-alert');
                    alert.innerText = `NEW WEAPON: ${WEAPONS[player.weaponIdx].name}`;
                    alert.style.opacity = 1; setTimeout(() => alert.style.opacity = 0, 1500);
                }
            });

            const pDot = document.getElementById('p-dot');
            if(pDot) {
                pDot.style.left = (75 + (player.pos.x / 500) * 150) + 'px';
                pDot.style.top = (75 + (player.pos.z / 500) * 150) + 'px';
                pDot.style.transform = `translate(-50%, -50%) rotate(${-player.rotY}rad)`;
            }
            document.getElementById('hp-fill').style.width = player.hp + '%';
            document.getElementById('shield-fill').style.width = player.shield + '%';
            document.getElementById('ammo-val').innerText = player.ammo;
            document.getElementById('weapon-name').innerText = wp.name;
            
            for(let id in remotePlayers) {
                const rp = remotePlayers[id];
                const vector = rp.mesh.position.clone();
                vector.y += 8;
                vector.project(camera);
                if(vector.z < 1) {
                    rp.hpContainer.style.display = 'block';
                    rp.hpContainer.style.left = ((vector.x + 1)/2 * window.innerWidth) + 'px';
                    rp.hpContainer.style.top = (-(vector.y - 1)/2 * window.innerHeight) + 'px';
                    rp.hpContainer.querySelector('.remote-hp-fill').style.width = rp.currentHp + '%';
                } else { rp.hpContainer.style.display = 'none'; }
            }
            renderer.render(scene, camera);
        }

        function checkWall(x, z, y) {
            const r = 3.9; if (y > 19) return false;
            for(let w of walls) { if(x+r > w.x1 && x-r < w.x2 && z+r > w.z1 && z-r < w.z2) return true; }
            return false;
        }

        window.addEventListener('resize', () => { if(camera) { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }});
    </script>

</body>
</html>
